name: PyPI publish

# Build an sdist and wheel and upload them with twine.
# target: pypi | testpypi | "" (auto: release → pypi; tag push → testpypi when
# the tag contains "rc", pypi otherwise). Tag pushes must point at a commit on
# the default branch. Re-uploading an existing version is a no-op.
on:
  workflow_call:
    inputs:
      target:
        type: string
        default: ""
      python-version:
        type: string
        default: "3.12"
    secrets:
      PYPI_API_TOKEN:
        required: false
      TEST_PYPI_API_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target: ${{ steps.target.outputs.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on the default branch
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git branch -r --contains "$GITHUB_SHA" | grep -qx "  origin/${DEFAULT_BRANCH}"; then
            echo "Tag is on ${DEFAULT_BRANCH}"
          else
            echo "::error::Tags must be created from ${DEFAULT_BRANCH}"
            exit 1
          fi

      - name: Resolve target
        id: target
        env:
          TARGET: ${{ inputs.target }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ -z "$TARGET" ]; then
            if [ "$EVENT" = "release" ]; then TARGET=pypi
            elif [[ "$REF" == refs/tags/* && "$REF" == *rc* ]]; then TARGET=testpypi
            elif [[ "$REF" == refs/tags/* ]]; then TARGET=pypi
            else echo "::error::No target given and none implied by $EVENT $REF"; exit 1
            fi
          fi
          echo "target=$TARGET" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Build package
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install twine
      - name: Upload
        env:
          TARGET: ${{ needs.build.outputs.target }}
          TWINE_USERNAME: __token__
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          TEST_PYPI_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          if [ "$TARGET" = "testpypi" ]; then
            TWINE_PASSWORD="$TEST_PYPI_TOKEN" twine upload --skip-existing --repository testpypi dist/*
          else
            TWINE_PASSWORD="$PYPI_TOKEN" twine upload --skip-existing dist/*
          fi
